{% extends "base.html" %}

{% block title %}
Welcome — Samira's 21st
{% endblock %}

{% block content %}

<section class="guest-page">

    <div class="guest-container">

        <p class="eyebrow">
            BEFORE WE BEGIN
        </p>

        <h1>
            Let's make this
            <span>personal.</span>
        </h1>

        <p class="guest-intro">
            Tell us your name and email address.
            We'll prepare your personal invitation
            to Samira's special evening.
        </p>

        <form
            action="{{ url_for('guest.create_invitation') }}"
            method="POST"
            class="guest-form"
        >

            <div class="form-group">

                <label for="name">
                    Your name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    autocomplete="name"
                    required
                >

            </div>

            <div class="form-group">

                <label for="email">
                    Your email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>

            <button
                type="submit"
                class="primary-button"
            >
                Continue
                <span>→</span>
            </button>

        </form>

    </div>

</section>

{% endblock %}
